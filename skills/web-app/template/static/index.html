<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Веб-приложение агента</title>
    <style>
        :root {
            --bg: #0d1117;
            --fg: #e6edf3;
            --accent: #58a6ff;
            --border: #30363d;
            --card: #161b22;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            max-width: 480px;
            width: 90%;
            text-align: center;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: var(--fg); opacity: 0.7; margin-bottom: 1.5rem; }
        .status {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            background: rgba(88, 166, 255, 0.1);
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: 500;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Веб-приложение агента</h1>
        <p>Замените этот файл на свою страницу.<br>Шаблон: <code>static/index.html</code></p>
        <span class="status">Работает</span>
    </div>
</body>
</html>
